name: Confirmations isolated

on:
  push:
    branches:
      - fix/confirmations-openai-nano

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check confirmations/classifier.js
          node --check confirmations/inbound-processor.js
          node --check confirmations/lifecycle.js
          node --check confirmations/acknowledgments.js
      - name: Focused behavior
        run: |
          node --input-type=module <<'NODE'
          import { classifyInbound, INTENTS } from './confirmations/classifier.js';
          import { buildAckText } from './confirmations/acknowledgments.js';

          const cases = [
            ['Sí', INTENTS.CONFIRM],
            ['👍', INTENTS.CONFIRM],
            ['No puedo ir', INTENTS.CANCEL],
            ['No puedo, ¿se puede cambiar para el lunes?', INTENTS.RESCHEDULE],
            ['¿Dónde queda?', INTENTS.OTHER],
            ['ya', INTENTS.AMBIGUOUS],
          ];

          for (const [text, expected] of cases) {
            const r = await classifyInbound(text);
            if (r.intent !== expected) throw new Error(`${text}: ${r.intent} != ${expected}`);
            if (r.model !== 'deterministic') throw new Error(`unexpected model ${r.model}`);
          }

          const appt = {
            patient_name: 'Ana',
            appointment_at: '2026-09-07T15:00:00Z',
            branch_id: 39,
          };
          if (buildAckText(appt, 'other') !== null) throw new Error('other must not ack');
          if (buildAckText(appt, 'ambiguous') !== null) throw new Error('ambiguous must not ack');
          if (!buildAckText(appt, 'confirm')) throw new Error('confirm must ack');
          NODE
      - name: Dispatcher tests
        run: npm test
      - name: Remove one-shot workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/confirmations-isolated.yml
          git commit -m 'ci: remove one-shot confirmations workflow'
          git push
