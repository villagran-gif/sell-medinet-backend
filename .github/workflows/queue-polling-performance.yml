name: Queue polling performance patch

on:
  push:
    branches:
      - fix/chatwoot-queue-polling-performance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chatwoot-queue-polling-performance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 scripts/patch-polling-window.py
      - name: Validate
        run: |
          node --check chatwoot-webhook/transcription/polling.js
          node --check chatwoot-webhook/routes/events.js
          npm test
          node --input-type=module <<'NODE'
          import { isWithinRecentWindow } from './chatwoot-webhook/transcription/polling.js';
          const now = Date.now();
          if (!isWithinRecentWindow({start_time:new Date(now-60_000).toISOString()}, now-120_000, ['start_time'])) process.exit(1);
          if (isWithinRecentWindow({start_time:new Date(now-600_000).toISOString()}, now-120_000, ['start_time'])) process.exit(2);
          NODE
      - name: Commit patch and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatwoot-webhook/transcription/polling.js
          git rm scripts/patch-polling-window.py .github/workflows/queue-polling-performance.yml
          git commit -m 'perf: limitar polling Twilio a la ventana real'
          git push origin HEAD:fix/chatwoot-queue-polling-performance
